<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed — Listenly</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --text: #f5efe6;
      --muted: #a49d8f;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 96px 24px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="container">
    <h1 id="title">Your email is confirmed</h1>
    <p id="next">Open the Listenly app and log in.</p>
  </main>
  <script>
    // Spanish when the browser's first language is Spanish. The address stays
    // the same, so the app's confirmation link needs no second redirect URL.
    (function () {
      var lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      if (!/^es\b/i.test(lang)) return;
      document.documentElement.lang = 'es';
      document.title = 'Correo confirmado — Listenly';
      document.getElementById('title').textContent = 'Tu correo está confirmado';
      document.getElementById('next').textContent = 'Abre la app Listenly e inicia sesión.';
    })();
  </script>
</body>
</html>
