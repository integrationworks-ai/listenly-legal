<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed — Listenly</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --text: #f5efe6;
      --muted: #a49d8f;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 96px 24px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    p {
      margin: 0 0 32px;
      color: var(--muted);
    }
    a.button {
      display: inline-block;
      padding: 16px 32px;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Your email is confirmed</h1>
    <p>Open the Listenly app and log in.</p>
    <a class="button" href="com.jebontheside.listenly://auth/callback">Open Listenly</a>
  </main>
</body>
</html>
